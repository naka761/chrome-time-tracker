spring.application.name=chrome-time-tracker

logging.charset.file=UTF-8

server.address=127.0.0.1
server.port=18080

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/chrome_time_tracker
spring.datasource.username=${TRACKER_DB_USER:tracker_user}
spring.datasource.password=${TRACKER_DB_PASSWORD}

spring.sql.init.mode=always

# \u30D0\u30C3\u30AF\u30B0\u30E9\u30A6\u30F3\u30C9\u8D77\u52D5\u6642\u306E\u30ED\u30B0\u4FDD\u5B58\u5148
logging.file.name=${user.home}/AppData/Local/ChromeTimeTracker/logs/chrome-time-tracker.log
